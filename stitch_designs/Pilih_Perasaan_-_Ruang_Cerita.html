<script>
  (function() {
    const cards = document.querySelectorAll('.feeling-card');
    const ttsButton = document.getElementById('ttsButton');
    const ttsNotice = document.getElementById('ttsNotice');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.style.boxShadow = '';
          const badge = c.querySelector('.badge-check');
          if (badge) badge.classList.add('hidden');
        });

        card.setAttribute('aria-checked', 'true');
        card.style.boxShadow = '0 0 0 2px #4d41df';
        const activeBadge = card.querySelector('.badge-check');
        if (activeBadge) activeBadge.classList.remove('hidden');
      });
    });

    if (ttsButton && ttsNotice) {
      let isPlaying = false;
      ttsButton.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          ttsNotice.classList.remove('hidden');
          ttsNotice.classList.add('flex');
          if ('speechSynthesis' in window) {
            const utter = new SpeechSynthesisUtterance('Apa yang paling kamu rasakan saat ini? Pilih yang paling mendekati. Tidak harus sempurna.');
            utter.lang = 'id-ID';
            utter.onend = () => {
              ttsNotice.classList.add('hidden');
              ttsNotice.classList.remove('flex');
              isPlaying = false;
            };
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utter);
          }
        } else {
          ttsNotice.classList.add('hidden');
          ttsNotice.classList.remove('flex');
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }
      });
    }
  })();
